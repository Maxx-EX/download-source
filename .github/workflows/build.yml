# LM-Chat CI: build debug APK with NDK/C++ and upload as artifact.
# ubuntu-latest runner 已自带 Android SDK（platform-34 / build-tools 34 / NDK 26 / CMake 3.22）
# 且 licenses 已 accept，无需任何 setup-android action。
name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms"
          echo "--- ndk ---"; ls "$ANDROID_HOME/ndk"
          echo "--- cmake ---"; ls "$ANDROID_HOME/cmake"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LM-Chat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
