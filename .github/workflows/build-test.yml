name: build-apk-test
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build Debug
        run: gradle :app:assembleZetaDebug :app:assembleOmegaDebug --no-daemon
      - name: Upload Zeta Debug
        uses: actions/upload-artifact@v4
        with:
          name: app-zeta-debug
          path: app/build/outputs/apk/zeta/debug/app-zeta-debug.apk
      - name: Upload Omega Debug
        uses: actions/upload-artifact@v4
        with:
          name: app-omega-debug
          path: app/build/outputs/apk/omega/debug/app-omega-debug.apk
