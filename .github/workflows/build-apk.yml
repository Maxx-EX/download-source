name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

permissions:
  contents: write # 必须添加这个权限才能自动创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Zeta + Omega debug APKs
        run: gradle :app:assembleZetaDebug :app:assembleOmegaDebug --no-daemon --stacktrace

      - name: Rename & collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/zeta/debug/app-zeta-debug.apk   out/DownloadSource-Zeta-2.3.0.apk
          cp app/build/outputs/apk/omega/debug/app-omega-debug.apk out/DownloadSource-Omega-2.3.0.apk
          ls -lh out

      # 保留原有的 Artifact 上传，方便在不登录 GitHub 的情况下直接在 Actions 页面下载
      - name: Upload Zeta (test)
        uses: actions/upload-artifact@v4
        with: { name: zeta-debug-apk, path: out/DownloadSource-Zeta-2.3.0.apk }

      - name: Upload Omega (release)
        uses: actions/upload-artifact@v4
        with: { name: omega-debug-apk, path: out/DownloadSource-Omega-2.3.0.apk }

      # 自动创建 Release 并上传 Omega 发行版
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0-build${{ github.run_number }} # 每次构建以 build 号区分，防止冲突
          name: Download source v2.3.0 (Build #${{ github.run_number }})
          body: |
            🌟 本次自动构建已发布
            
            **包含内容：**
            - `Omega` 通道包 (发行版，推荐日常使用)
            - `Zeta` 通道包 (测试版，可在 Actions 页面下载)
            
            **更新日志：**
            - 修复了 JVM 兼容和 Compose 报错
            - 增加长按复制链接
            - 增加清理缓存功能
            - 优化 M3U8 转换 MP4 逻辑
            
            (●'◡'●) 祝你下载愉快
          files: |
            out/DownloadSource-Omega-2.3.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
