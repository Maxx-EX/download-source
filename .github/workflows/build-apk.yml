name: build-apk
on:
  push: { branches: [ main ] }
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Zeta + Omega
        run: gradle :app:assembleZetaDebug :app:assembleOmegaDebug --no-daemon --stacktrace

      - name: Rename & collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/zeta/debug/app-zeta-debug.apk   out/DownloadSource-Zeta-1.0.0-debug.apk
          cp app/build/outputs/apk/omega/debug/app-omega-debug.apk out/DownloadSource-Omega-1.0.0-debug.apk
          ls -lh out

      - name: Upload Zeta (test)
        uses: actions/upload-artifact@v4
        with: { name: zeta-debug-apk, path: out/DownloadSource-Zeta-1.0.0-debug.apk }

      - name: Upload Omega (release)
        uses: actions/upload-artifact@v4
        with: { name: omega-debug-apk, path: out/DownloadSource-Omega-1.0.0-debug.apk }
