name: build-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build Zeta + Omega
        run: gradle :app:assembleZetaDebug :app:assembleOmegaDebug --no-daemon --stacktrace
      - name: Rename & collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/zeta/debug/app-zeta-debug.apk   out/DownloadSource-Zeta-v2.8.1.apk
          cp app/build/outputs/apk/omega/debug/app-omega-debug.apk out/DownloadSource-Omega-v2.8.1.apk
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with: { name: zeta-debug-apk, path: out/DownloadSource-Zeta-v2.8.1.apk }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.1-build${{ github.run_number }}
          name: Download source v2.8.1
          body: |
            🚀 更新说明
            
            **Omega 是发行版（稳定），Zeta 是内测版（实验性功能）。**
            网盘解析（百度、夸克等）目前仅在内测版开放体验。
            
            - 🛠 修复编译报错。
            - 🧪 增加内测/发行版本隔离机制。
            - 🧪 内测版开放四大网盘解析测试。
            - 🛡 支持自定义 Header (防 403)。
          files: |
            out/DownloadSource-Zeta-v2.8.1.apk
            out/DownloadSource-Omega-v2.8.1.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
