name: build-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build Zeta + Omega
        run: gradle :app:assembleZetaDebug :app:assembleOmegaDebug --no-daemon --stacktrace
      - name: Rename & collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/zeta/debug/app-zeta-debug.apk   out/DownloadSource-Zeta-v2.4.0.apk
          cp app/build/outputs/apk/omega/debug/app-omega-debug.apk out/DownloadSource-Omega-v2.4.0.apk
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with: { name: zeta-debug-apk, path: out/DownloadSource-Zeta-v2.4.0.apk }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0-build${{ github.run_number }}
          name: Download source v2.4.0
          body: |
            🚀 全新版本发布
            - 修复各类闪退和路径识别问题
            - 引入 JS 注入深度抓流引擎
            - 全新多主题渐变UI
            - 智能队列与断点重试
          files: |
            out/DownloadSource-Omega-v2.4.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
