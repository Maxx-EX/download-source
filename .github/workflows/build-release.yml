name: build-apk-release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许 gh workflow run 手动触发

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Parse Version from Tag
        id: vars
        run: |
          # 如果是手动触发，用默认版本；如果是 Tag 触发，读取 Tag
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG="v3.0.1-build1"
          fi
          VERSION_NAME=$(echo $TAG | sed 's/^v//' | cut -d'-' -f1)
          BUILD_NUM=$(echo $TAG | sed 's/.*-build//')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$BUILD_NUM" >> $GITHUB_ENV

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV

      - name: Build Signed Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleZetaRelease :app:assembleOmegaRelease --no-daemon

      - name: Rename Artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/zeta/release/app-zeta-release.apk   out/DownloadSource-Zeta-v${VERSION_NAME}.apk
          cp app/build/outputs/apk/omega/release/app-omega-release.apk out/DownloadSource-Omega-v${VERSION_NAME}.apk

      # 只有打 Tag 的时候才创建 Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Download Source v${{ env.VERSION_NAME }}
          body_path: CHANGELOG.md
          files: |
            out/DownloadSource-Zeta-v${{ env.VERSION_NAME }}.apk
            out/DownloadSource-Omega-v${{ env.VERSION_NAME }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # 如果只是手动测试没打 Tag，就把产物传到 Actions Artifacts 里
      - name: Upload Artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: release-test-apks
          path: out/*.apk
